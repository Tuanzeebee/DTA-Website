<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#0B1A15"/>
      <stop offset="0.55" stop-color="#123026"/>
      <stop offset="1" stop-color="#1B4A38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C96B"/>
      <stop offset="1" stop-color="#C99436"/>
    </linearGradient>
    <linearGradient id="moss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FC9A8"/>
      <stop offset="1" stop-color="#5FA98B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FC9A8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8FC9A8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8FC9A8" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>
  <ellipse cx="1330" cy="40" rx="420" ry="220" fill="url(#glow)"/>
  <ellipse cx="180" cy="230" rx="380" ry="180" fill="url(#glow)" opacity="0.6"/>

  <!-- Trống-đồng style emblem -->
  <g transform="translate(112,200)" fill="none" stroke="url(#gold)">
    <circle r="74" stroke-width="2.5"/>
    <circle r="60" stroke-width="1" opacity="0.55"/>
    <circle r="26" stroke-width="1.5" opacity="0.8"/>
    <g stroke-width="2">
      <path d="M0-74V-60M0 74V60M-74 0H-60M74 0H60"/>
      <path d="M52-52 42-42M52 52 42 42M-52-52-42-42M-52 52-42 42" opacity="0.7"/>
    </g>
    <path d="M0-14 4-4 15-4 6 3 9 13 0 7-9 13-6 3-15-4-4-4Z" fill="url(#gold)" stroke="none"/>
  </g>

  <!-- Headline -->
  <text x="230" y="130" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" letter-spacing="6" fill="#F0C96B">HIỆP HỘI CÔNG NGHỆ SỐ ĐÀ NẴNG</text>
  <text x="228" y="220" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="bold" letter-spacing="2" fill="#F4F9F6">CHUYỂN ĐỔI SỐ <tspan fill="url(#gold)">ĐÀ NẴNG 2026</tspan></text>
  <text x="230" y="280" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="1" fill="#B9CDC2">Đồng hành cùng doanh nghiệp trên hành trình số hóa toàn diện</text>

  <!-- CTA pill -->
  <g transform="translate(1270,130)">
    <rect width="250" height="52" rx="26" fill="url(#moss)"/>
    <text x="125" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" letter-spacing="2" fill="#0B1A15">TÌM HIỂU THÊM</text>
  </g>
</svg>