<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#0E211B"/>
      <stop offset="0.55" stop-color="#1E4A39"/>
      <stop offset="1" stop-color="#2E6A49"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8D08D"/>
      <stop offset="1" stop-color="#6FA85F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C96B"/>
      <stop offset="1" stop-color="#C99436"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6FA85F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6FA85F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6FA85F" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>
  <ellipse cx="1400" cy="60" rx="380" ry="200" fill="url(#glow)"/>
  <ellipse cx="200" cy="340" rx="380" ry="180" fill="url(#glow)" opacity="0.5"/>

  <!-- Badge -->
  <g transform="translate(120,160)">
    <rect width="160" height="40" rx="20" fill="url(#lime)"/>
    <text x="80" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0E211B">CHƯƠNG TRÌNH</text>
  </g>

  <!-- Headline -->
  <text x="120" y="240" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" letter-spacing="4" fill="#A8D08D">HỖ TRỢ SỐ HÓA CHO SME</text>
  <text x="118" y="300" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" letter-spacing="1" fill="#F4F9F6">TP. ĐÀ NẴNG <tspan fill="url(#gold)">2026</tspan></text>
  <text x="120" y="355" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="1" fill="#B9D8C2">Ngân sách 50 tỷ · Hỗ trợ tối đa 70% chi phí · Đăng ký từ nay đến 30/09</text>

  <!-- CTA pill -->
  <g transform="translate(1250,140)">
    <rect width="280" height="56" rx="28" fill="url(#lime)"/>
    <text x="140" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" letter-spacing="2" fill="#0E211B">XEM ĐIỀU KIỆN & ĐĂNG KÝ</text>
  </g>

  <!-- Right accent -->
  <g transform="translate(1350,200)" fill="url(#lime)">
    <rect x="-40" y="-40" width="80" height="80" rx="16" opacity="0.2"/>
    <text x="0" y="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#A8D08D">70%</text>
    <text x="0" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#B9D8C2">Hỗ trợ</text>
  </g>
</svg>