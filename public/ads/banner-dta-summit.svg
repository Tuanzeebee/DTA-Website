<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#121B2E"/>
      <stop offset="0.55" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#2A5A8E"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FD1C0"/>
      <stop offset="1" stop-color="#5AA9E6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C96B"/>
      <stop offset="1" stop-color="#C99436"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5AA9E6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5AA9E6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="circuit" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 24h48M24 0v48" fill="none" stroke="#5AA9E6" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="24" cy="24" r="3" fill="#5AA9E6" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#circuit)"/>
  <ellipse cx="1400" cy="50" rx="380" ry="200" fill="url(#glow)"/>
  <ellipse cx="200" cy="350" rx="350" ry="150" fill="url(#glow)" opacity="0.5"/>

  <!-- DTA Logo mark -->
  <g transform="translate(100,200)">
    <circle r="68" fill="url(#cyan)"/>
    <text x="0" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#121B2E">DTA</text>
  </g>

  <!-- Headline -->
  <text x="250" y="150" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" letter-spacing="8" fill="#7FD1C0">SỰ KIỆN CÔNG NGHỆ HÀNG NĂM</text>
  <text x="248" y="240" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="bold" letter-spacing="1" fill="#F4F9F6">DTA SUMMIT <tspan fill="url(#gold)">2026</tspan></text>
  <text x="250" y="300" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="1" fill="#A9C6BC">Sự kiện công nghệ lớn nhất miền Trung — Kết nối · Hợp tác · Phát triển</text>

  <!-- Date/Location -->
  <text x="250" y="350" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#F0C96B">📍 Tòa nhà Công Viên Phần Mềm, Đà Nẵng  |  15-16/10/2026</text>

  <!-- CTA pill -->
  <g transform="translate(1280,140)">
    <rect width="260" height="56" rx="28" fill="url(#cyan)"/>
    <text x="130" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" letter-spacing="2" fill="#121B2E">ĐĂNG KÝ THAM DỰ</text>
  </g>
</svg>